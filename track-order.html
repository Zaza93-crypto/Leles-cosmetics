<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Track Order | Lele's Cosmetics</title><style>
:root{--deep:#321526;--rose:#96345f;--pink:#fae8ef;--cream:#fffaf7;--muted:#766871;--line:#eadde3}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--cream);color:#332831}.wrap{width:min(650px,92%);margin:auto}header{background:var(--deep);color:#fff;padding:20px 0}h1{margin:0;font-size:1.35rem}main{padding:35px 0}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 10px 30px rgba(50,21,38,.07)}.muted{color:var(--muted)}input{width:100%;height:48px;border:1px solid #d9cbd2;border-radius:10px;padding:12px;font:inherit;margin:10px 0}button{width:100%;border:0;border-radius:10px;padding:13px;font-weight:800;cursor:pointer;background:var(--rose);color:#fff}.error{color:#a12626;margin-top:12px}.result{margin-top:20px}.orderNo{font-weight:900;color:var(--deep);font-size:1.2rem}.status{margin:18px 0;padding:14px;border-radius:12px;background:var(--pink);color:var(--rose);font-weight:900;text-align:center}.steps{display:grid;gap:9px}.step{padding:12px;border:1px solid var(--line);border-radius:10px;color:var(--muted)}.step.active{background:var(--pink);color:var(--deep);font-weight:800}.detail{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.hidden{display:none}</style></head><body><header><div class="wrap"><h1>Lele's Cosmetics</h1><div style="margin-top:4px;color:#e8dbe1">Track your order</div></div></header><main class="wrap"><section class="card"><h2 style="margin-top:0">Track Order</h2><p class="muted">Enter the order number you received after placing your order.</p><input id="orderNumber" placeholder="e.g. LELE-ABC123" autocomplete="off"><button id="trackBtn">Track Order</button><div id="error" class="error"></div><div id="result" class="result hidden"><div class="orderNo" id="displayOrder"></div><div class="status" id="displayStatus"></div><div class="steps" id="steps"></div><div class="detail"><b>Total:</b> <span id="displayTotal"></span></div><div class="detail"><b>Order date:</b> <span id="displayDate"></span></div></div></section></main><script>
const statuses=["Pending","Confirmed","Preparing","Out for Delivery","Delivered"];const money=n=>"K"+Number(n||0).toFixed(2);const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function trackOrder(){const input=document.getElementById("orderNumber"),btn=document.getElementById("trackBtn"),error=document.getElementById("error"),result=document.getElementById("result"),code=input.value.trim().toUpperCase();error.textContent="";result.classList.add("hidden");if(!code){error.textContent="Please enter your order number.";return}btn.disabled=true;btn.textContent="Checking…";try{const r=await fetch("/api/orders?order_number="+encodeURIComponent(code),{cache:"no-store"}),d=await r.json();if(!r.ok||d.success===false)throw Error(d.error||"Could not find order.");const o=d.order;document.getElementById("displayOrder").textContent=o.order_number;document.getElementById("displayStatus").textContent="Current status: "+o.status;document.getElementById("displayTotal").textContent=money(o.total);document.getElementById("displayDate").textContent=o.created_at||"—";const current=statuses.indexOf(o.status);document.getElementById("steps").innerHTML=statuses.map((s,i)=>`<div class="step ${i<=current&&o.status!=="Cancelled"?"active":""}">${i<=current&&o.status!=="Cancelled"?"✓ ":""}${esc(s)}</div>`).join("");if(o.status==="Cancelled")document.getElementById("steps").innerHTML+='<div class="step active">Order cancelled</div>';result.classList.remove("hidden")}catch(e){error.textContent=e.message||"Could not find order."}finally{btn.disabled=false;btn.textContent="Track Order"}}
document.getElementById("trackBtn").onclick=trackOrder;document.getElementById("orderNumber").onkeydown=e=>{if(e.key==="Enter")trackOrder()};
</script></body></html>
