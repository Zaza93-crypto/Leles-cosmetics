<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leles Cosmetics - Perfume Collection</title>
<style>
  body{font-family:system-ui,sans-serif;background:#fffaf6;margin:0;padding:20px}

  .grid{max-width:1200px;margin:20px auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
  .card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.08)}
  .card img{width:100%;height:360px;object-fit:cover;display:block;background:#f5f0eb}
  .info{padding:14px}
</style>
</head>
<body>
<h1>Leles Cosmetics - Perfume Collection</h1>
<p style="text-align:center">If images still don't show, check that the folder assets/perfumes/ is in the SAME folder as this html file.</p>
<div class="grid">
  <div class="card"><img src="./assets/perfumes/01-chocolate-roll-on.jpg" alt="01"><div class="info">Chocolate Roll-on</div></div>
  <div class="card"><img src="./assets/perfumes/02-malikat-al-arab-burgundy.jpg" alt="02"><div class="info">Malikat Burgundy</div></div>
  <div class="card"><img src="./assets/perfumes/03-ameerat-al-arab-red.jpg" alt="03"><div class="info">Ameerat Red</div></div>
  <div class="card"><img src="./assets/perfumes/04-malikat-al-arab-pink-box.jpg" alt="04"><div class="info">Malikat Pink</div></div>
  <div class="card"><img src="./assets/perfumes/05-malikat-al-arab-k100-poster.jpg" alt="05"><div class="info">K100 Poster</div></div>
  <div class="card"><img src="./assets/perfumes/06-kiara-pistachio-frost.jpg" alt="06"><div class="info">Kiara Pistachio</div></div>
  <div class="card"><img src="./assets/perfumes/07-farfashah-pink.jpg" alt="07"><div class="info">Farfashah</div></div>
  <div class="card"><img src="./assets/perfumes/08-heena-attar.jpg" alt="08"><div class="info">Heena</div></div>
  <div class="card"><img src="./assets/perfumes/09-sandal-heena-duo.jpg" alt="09"><div class="info">Sandal & Heena</div></div>
</div>
</body>
</html>
