<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lele's Beauty Expert</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f8f2ef;color:#35151f}
.hero{min-height:100vh;display:grid;place-items:center;text-align:center;padding:30px}
.card{max-width:760px;background:#fff;padding:45px;border-radius:28px;box-shadow:0 20px 60px rgba(60,20,30,.12)}
h1{font-size:42px;margin:0 0 15px;color:#6e1736}
p{font-size:18px;line-height:1.6;color:#654b54}
.badge{display:inline-block;padding:8px 13px;border-radius:999px;background:#f0e2e6;color:#6e1736;font-weight:bold}
</style>
</head>
<body>
<div class="hero">
  <div class="card">
    <span class="badge">AI BEAUTY EXPERT</span>
    <h1>Lele's Beauty Expert</h1>
    <p>Ask about perfume notes, EDP vs EDT, fragrance families, longevity, layering, body oils, occasions, men's and women's fragrance styles, and choosing a scent.</p>
    <p><strong>Tap the 💬 button</strong> to start chatting.</p>
  </div>
</div>
<script src="lele-beauty-agent.js"></script>
</body>
</html>
